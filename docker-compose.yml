    external_links:
      - operations:dns
      - logs:fluentd
      - operations:proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://prometheus-app-proxy-internal"]
      interval: 300s
