services:

  app:
    image: prom/prometheus@sha256:e2b8aa62b64855956e3ec1e18b4f9387fb6203174a4471936f4662f437f04405  # pinned digest (was untagged; version unknown, 2026-10-18)
    container_name: prometheus-app
    dns: ${DNS_IP_INTERNAL}
    external_links:
      - operations:dns
      - logs:fluentd
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://prometheus-app:9090"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    volumes:
      - ./prometheus/:/etc/prometheus/
      - ${NR_DATA_DIR}/prometheus:/prometheus:rw
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - cadvisor
    restart: ${RESTART}
    env_file:
      - ./prometheus.env
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.2
        aliases:
          - prometheus
    # logging:
    #   driver: "fluentd"
    #   options:
    #     fluentd-address: logger.finsec.localdomain:24224
    #     tag: "{{.Name}}.{{.ID}}"
    #     fluentd-async: "true"
    #     fluentd-max-retries: "144"
    #     fluentd-retry-wait: "600s"

  node-exporter:
    image: prom/node-exporter@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a  # pinned digest (was untagged; version unknown, 2026-10-18)
    container_name: prometheus-node-exporter
    dns: ${DNS_IP_INTERNAL}
    external_links:
      - operations:dns
      - logs:fluentd
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://prometheus-node-exporter:9100"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ${NR_DATA_DIR}/textfile:/textfile:ro   # *.prom written by host scripts, e.g. scripts/timeshift-metrics.sh
    command: 
      - '--path.procfs=/host/proc' 
      - '--path.sysfs=/host/sys'
      - '--collector.textfile.directory=/textfile'
      - --collector.filesystem.ignored-mount-points
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
    restart: ${RESTART}
    deploy:
      mode: global
    env_file:
      - ./prometheus.env
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.3
    # logging:
    #   driver: "fluentd"
    #   options:
    #     fluentd-address: logger.finsec.localdomain:24224
    #     tag: "{{.Name}}.{{.ID}}"
    #     fluentd-async: "true"
    #     fluentd-max-retries: "144"
    #     fluentd-retry-wait: "600s"

  alertmanager:
    image: prom/alertmanager@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba  # pinned digest (was untagged; version unknown, 2026-10-18)
    container_name: prometheus-alertmanager
    dns: ${DNS_IP_INTERNAL}
    external_links:
      - operations:dns
      - logs:fluentd
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://prometheus-alertmanager:9093"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    volumes:
      - "./alertmanager/:/etc/alertmanager/"
    restart: ${RESTART}
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.advertise-address=172.34.7.4:9093'
    env_file:
      - ./prometheus.env
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.4
    # logging:
    #   driver: "fluentd"
    #   options:
    #     fluentd-address: logger.finsec.localdomain:24224
    #     tag: "{{.Name}}.{{.ID}}"
    #     fluentd-async: "true"
    #     fluentd-max-retries: "144"
    #     fluentd-retry-wait: "600s"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388  # pinned digest (was untagged; version unknown, 2026-10-18)
    container_name: prometheus-cadvisor
    dns: ${DNS_IP_INTERNAL}
    external_links:
      - operations:dns
      - logs:fluentd
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://prometheus-cadvisor:8080"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /sys/fs/cgroup:/cgroup:ro
      - /dev/disk/:/dev/disk:ro
      - /var/lib/dbus/machine-id:/var/lib/dbus/machine-id:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/machine-id:/etc/machine-id:ro
    restart: ${RESTART}
    devices:
      - /dev/kmsg:/dev/kmsg
    security_opt:
      - no-new-privileges:true
    command:
      - '-allow_dynamic_housekeeping=false'
      - '-housekeeping_interval=20s'
      - '-docker_only=true'
      - '--disable_metrics=disk,diskIO,memory_numa,referenced_memory,percpu,sched,process,tcp,udp,advtcp,hugetlb,cpu_topology,resctrl'
      - '-store_container_labels=false'
      - '-whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service'
      - '-event_storage_age_limit=default=0'
      - '-event_storage_event_limit=default=0'
    deploy:
      mode: global
      resources:
        limits:
          cpus: "0.5"
          memory: "1G"      
    env_file:
      - ./prometheus.env
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.5
    # logging:
    #   driver: "fluentd"
    #   options:
    #     fluentd-address: logger.finsec.localdomain:24224
    #     tag: "{{.Name}}.{{.ID}}"
    #     fluentd-async: "true"
    #     fluentd-max-retries: "144"
    #     fluentd-retry-wait: "600s"

  grafana:
    image: grafana/grafana@sha256:52c3e20686b860c6dc1f623811565773cf51eefa378817a4896dfc863c3c82c8  # pinned digest (was untagged; version unknown, 2026-10-18)
    container_name: prometheus-grafana
    dns: ${DNS_IP_INTERNAL}
    external_links:
      - operations:dns
      - logs:fluentd
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://prometheus-grafana:3000"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    volumes:
      - ${DATA_DIR}/grafana:/var/lib/grafana:rw
      - ./grafana/provisioning/:/etc/grafana/provisioning:rw
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/ldap.toml:/etc/grafana/ldap.toml
    env_file:
      - ./grafana/config.monitoring
      - ./prometheus.env
    restart: ${RESTART}
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.6
    # logging:
    #   driver: "fluentd"
    #   options:
    #     fluentd-address: logger.finsec.localdomain:24224
    #     tag: "{{.Name}}.{{.ID}}"
    #     fluentd-async: "true"
    #     fluentd-max-retries: "144"
    #     fluentd-retry-wait: "600s"

  grafana-proxy-internal:
    image: registry.finsec.localdomain/proxy-nginx
    container_name: prometheus-grafana-proxy-internal
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    depends_on:
      - grafana
    external_links:
      - operations:dns
      - logs:fluentd
      - operations:proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://prometheus-grafana-proxy-internal"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    environment:
      VIRTUAL_HOST: monitor.finsec.localdomain
      NETWORK_ACCESS: internal
    volumes:
      - ./grafana-nginx.conf:/etc/nginx/nginx.conf
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.7
        aliases:
         - monitor.finsec
         - monitor
    # logging:
    #   driver: "fluentd"
    #   options:
    #     fluentd-address: logger.finsec.localdomain:24224
    #     tag: "{{.Name}}.{{.ID}}"
    #     fluentd-async: "true"
    #     fluentd-max-retries: "144"
    #     fluentd-retry-wait: "600s"

  app-proxy-internal:
    image: registry.finsec.localdomain/proxy-nginx
    container_name: prometheus-app-proxy-internal
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    depends_on:
