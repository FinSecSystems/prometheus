  influxdb:
    image: influxdb:1.11.8
    container_name: prometheus-influxdb
    ports:
      - '${SERVER_IP}:8086:8086'
    env_file:
      - ./influxdb.env
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    external_links:
      - operations:dns
      - logs:fluentd
    healthcheck:
      test: ["CMD", "curl", "-f", "http://prometheus-influxdb:8086/health || exit 1"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5      
    volumes:
      - ${DATA_DIR}/influxdb/data:/var/lib/influxdb
      - ./influxdb/influxdb.conf:/etc/influxdb/influxdb.conf
#      - ${DATA_DIR}/influxdb/config:/etc/influxdb2
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.15

  influxdb-exporter-proxy-internal:
