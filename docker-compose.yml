services:

  app:
    image: prom/prometheus:v3.16.0   # was a digest of 3.3.1 (issue #9, 2026-11-05)
    container_name: prometheus-app
    dns: ${DNS_IP_INTERNAL}
    external_links:
      - operations:dns
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://prometheus-app:9090"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    volumes:
      - ./prometheus/:/etc/prometheus/
      - ${DB_DIR}/prometheus:/prometheus:rw   # TSDB on local disk: Prometheus does not support NFS (moved from $NR_DATA_DIR on 2026-11-01, old copy kept for rollback)
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - cadvisor
    restart: ${RESTART}
    env_file:
      - ./prometheus.env
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.2
        aliases:
          - prometheus

  node-exporter:
    image: prom/node-exporter:v1.12.1   # was a digest of 1.9.1 (issue #9, 2026-11-05)
    container_name: prometheus-node-exporter
    dns: ${DNS_IP_INTERNAL}
    external_links:
      - operations:dns
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://prometheus-node-exporter:9100"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ${NR_DATA_DIR}/textfile:/textfile:ro   # *.prom written by host scripts, e.g. scripts/timeshift-metrics.sh
    command: 
      - '--path.procfs=/host/proc' 
      - '--path.sysfs=/host/sys'
      - '--collector.textfile.directory=/textfile'
      - --collector.filesystem.ignored-mount-points
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
    restart: ${RESTART}
    deploy:
      mode: global
    env_file:
      - ./prometheus.env
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.3

  alertmanager:
    image: prom/alertmanager:v0.34.2   # was a digest of 0.28.1 (issue #9, 2026-11-05)
    container_name: prometheus-alertmanager
    dns: ${DNS_IP_INTERNAL}
    external_links:
      - operations:dns
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://prometheus-alertmanager:9093"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    volumes:
      - "./alertmanager/:/etc/alertmanager/"
    restart: ${RESTART}
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.advertise-address=172.34.7.4:9093'
    env_file:
      - ./prometheus.env
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.4

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1   # was a digest of 0.49.1 (issue #9, 2026-11-05)
    container_name: prometheus-cadvisor
    dns: ${DNS_IP_INTERNAL}
    external_links:
      - operations:dns
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://prometheus-cadvisor:8080"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /sys/fs/cgroup:/cgroup:ro
      - /dev/disk/:/dev/disk:ro
      - /var/lib/dbus/machine-id:/var/lib/dbus/machine-id:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/machine-id:/etc/machine-id:ro
    restart: ${RESTART}
    devices:
      - /dev/kmsg:/dev/kmsg
    security_opt:
      - no-new-privileges:true
    command:
      - '-allow_dynamic_housekeeping=false'
      - '-housekeeping_interval=20s'
      - '-docker_only=true'
      - '--disable_metrics=memory_numa,referenced_memory,percpu,sched,process,tcp,udp,advtcp,hugetlb,cpu_topology,resctrl'
      - '-store_container_labels=false'
      - '-whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service'
      - '-event_storage_age_limit=default=0'
      - '-event_storage_event_limit=default=0'
    deploy:
      mode: global
      resources:
        limits:
          cpus: "0.5"
          memory: "1G"      
    env_file:
      - ./prometheus.env
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.5

  grafana:
    image: grafana/grafana:13.2.5   # was a digest of 11.6.1 (issue #9, 2026-11-05); rollback: restore /home/ubuntu/dashboards-upgrade-backup-20261105/grafana.tgz into $DATA_DIR/grafana
    container_name: prometheus-grafana
    dns: ${DNS_IP_INTERNAL}
    external_links:
      - operations:dns
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://prometheus-grafana:3000"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    volumes:
      - ${DATA_DIR}/grafana:/var/lib/grafana:rw
      - ./grafana/provisioning/:/etc/grafana/provisioning:rw
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/ldap.toml:/etc/grafana/ldap.toml
    env_file:
      - ./grafana/config.monitoring
      - ./prometheus.env
    restart: ${RESTART}
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.6

  grafana-proxy-internal:
    image: registry.finsec.localdomain/proxy-nginx
    container_name: prometheus-grafana-proxy-internal
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    depends_on:
      - grafana
    external_links:
      - operations:dns
      - operations:proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://prometheus-grafana-proxy-internal"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    environment:
      VIRTUAL_HOST: monitor.finsec.localdomain
      NETWORK_ACCESS: internal
    volumes:
      - ./grafana-nginx.conf:/etc/nginx/nginx.conf
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.7
        aliases:
         - monitor.finsec
         - monitor

  app-proxy-internal:
    image: registry.finsec.localdomain/proxy-nginx
    container_name: prometheus-app-proxy-internal
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    depends_on:
      - app
    external_links:
      - operations:dns
      - operations:proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://prometheus-app-proxy-internal"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    environment:
      VIRTUAL_HOST: prometheus.finsec.localdomain
      NETWORK_ACCESS: internal
    volumes:
      - ./app-nginx.conf:/etc/nginx/nginx.conf
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.8
        aliases:
          - prometheus.finsec

  node-stats-proxy-internal:
    image: registry.finsec.localdomain/proxy-nginx
    container_name: prometheus-node-stats-proxy-internal
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    depends_on:
      - node-exporter
    external_links:
      - operations:dns
      - operations:proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://prometheus-node-stats-proxy-internal"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    environment:
      VIRTUAL_HOST: node-stats.finsec.localdomain
      NETWORK_ACCESS: internal
    volumes:
      - ./node-stats-nginx.conf:/etc/nginx/nginx.conf
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.9

  alertmanager-proxy-internal:
    image: registry.finsec.localdomain/proxy-nginx
    container_name: prometheus-alertmanager-proxy-internal
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    depends_on:
      - alertmanager
    external_links:
      - operations:dns
      - operations:proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://prometheus-alertmanager-proxy-internal"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    environment:
      VIRTUAL_HOST: alertmanager.finsec.localdomain
      NETWORK_ACCESS: internal
    volumes:
      - ./alertmanager-nginx.conf:/etc/nginx/nginx.conf
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.10

  cadvisor-proxy-internal:
    image: registry.finsec.localdomain/proxy-nginx
    container_name: prometheus-cadvisor-proxy-internal
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    depends_on:
      - cadvisor
    external_links:
      - operations:dns
      - operations:proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://prometheus-cadvisor-proxy-internal/containers/"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    environment:
      VIRTUAL_HOST: cadvisor.finsec.localdomain
      NETWORK_ACCESS: internal
    volumes:
      - ./cadvisor-nginx.conf:/etc/nginx/nginx.conf
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.11

  alertmanager-bot:
    image: metalmatze/alertmanager-bot:0.4.0
    container_name: prometheus-alertmanager-bot
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    external_links:
      - operations:dns
    environment:
      ALERTMANAGER_URL: http://prometheus-alertmanager:9093
      BOLT_PATH: /data/bot.db
      STORE: bolt
      TEMPLATE_PATHS: /data/default.tmpl
    env_file:
      - ./prometheus.env
    volumes:
      - ${DATA_DIR}/alertmanager-bot:/data
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.12

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1   # was a digest of 0.26.0 (issue #9, 2026-11-05)
    container_name: prometheus-blackbox-exporter
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    external_links:
      - operations:dns
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://prometheus-blackbox-exporter:9115"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    volumes:
      - ./blackbox-exporter:/config
    command:
      - '--config.file=/config/blackbox.yml'
      - '--log.level=warn'   # info logs every probe (was 675 MB of json-file log, #61)
    depends_on:
      - app
    env_file:
      - ./prometheus.env
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.13

  blackbox-exporter-proxy-internal:
    image: registry.finsec.localdomain/proxy-nginx
    container_name: prometheus-blackbox-exporter-proxy-internal
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    depends_on:
      - blackbox-exporter
    external_links:
      - operations:dns
      - operations:proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://prometheus-blackbox-exporter-proxy-internal"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    environment:
      VIRTUAL_HOST: blackbox-exporter.finsec.localdomain
      NETWORK_ACCESS: internal
    volumes:
      - ./blackbox-exporter-nginx.conf:/etc/nginx/nginx.conf
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.14

  influxdb:
    image: influxdb:1.11.8
    container_name: prometheus-influxdb
    ports:
      - '${SERVER_IP}:8086:8086'
    env_file:
      - ./influxdb.env
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    external_links:
      - operations:dns
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8086/health >/dev/null"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5      
    volumes:
      - ${DATA_DIR}/influxdb/data:/var/lib/influxdb
      - ./influxdb/influxdb.conf:/etc/influxdb/influxdb.conf
#      - ${DATA_DIR}/influxdb/config:/etc/influxdb2
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.15

  influxdb-exporter-proxy-internal:
    image: registry.finsec.localdomain/proxy-nginx
    container_name: prometheus-influxdb-proxy-internal
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    depends_on:
      - influxdb
    external_links:
      - operations:dns
      - operations:proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://127.0.0.1/health"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    environment:
      VIRTUAL_HOST: influxdb.finsec.localdomain
      NETWORK_ACCESS: internal
    volumes:
      - ./influxdb-nginx.conf:/etc/nginx/nginx.conf
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.16

  diun:
    image: crazymax/diun@sha256:e324b793eb32dfb7f74d3a39421ebf090141caaadee69b8f78da63112408ee25  # v4.33.0
    container_name: prometheus-diun
    dns: ${DNS_IP_INTERNAL}
    external_links:
      - operations:dns
    healthcheck:
      test: ["CMD", "diun", "--version"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${NR_DATA_DIR}/diun:/data
      - ./diun/notify.sh:/notify.sh:ro
    restart: ${RESTART}
    env_file:
      - ./diun.env
    depends_on:
      - alertmanager
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.17

  # Database and Redis exporters (issue #18). Multi-target: one exporter per kind, Prometheus passes the target as a URL parameter (jobs "redis", "postgres", "mysql").
  # The monitoring user "exporter" and the rendered configs in ${BUILD_DIR}/prometheus/exporters come from ./exporters-init.sh (password in the git-crypt file exporters.env).
  redis-exporter:
    image: oliver006/redis_exporter:v1.96.0-alpine
    container_name: prometheus-redis-exporter
    dns: ${DNS_IP_INTERNAL}
    external_links:
      - operations:dns
    restart: ${RESTART}
    command:
      - --redis.password-file=/cfg/redis-passwords.json   # allow-secret (a path to the rendered file, not a value)
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "--tries=1", "http://prometheus-redis-exporter:9121/metrics"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    volumes:
      - ${BUILD_DIR}/prometheus/exporters/redis-passwords.json:/cfg/redis-passwords.json:ro
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.18

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: prometheus-postgres-exporter
    dns: ${DNS_IP_INTERNAL}
    external_links:
      - operations:dns
    restart: ${RESTART}
    command:
      - --config.file=/cfg/postgres_exporter.yml
    volumes:
      - ${BUILD_DIR}/prometheus/exporters/postgres_exporter.yml:/cfg/postgres_exporter.yml:ro
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.19

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.21.0
    container_name: prometheus-mysqld-exporter
    dns: ${DNS_IP_INTERNAL}
    external_links:
      - operations:dns
    restart: ${RESTART}
    command:
      - --config.my-cnf=/cfg/my.cnf
      - --no-collect.slave_status          # needs SLAVE MONITOR; none of the servers replicates
    volumes:
      - ${BUILD_DIR}/prometheus/exporters/my.cnf:/cfg/my.cnf:ro
    networks:
      operations_intranet:
        ipv4_address: 172.34.7.20
      liquibrium_intranet:                 # websites-liquibrium-exchange-db lives only on this network
        ipv4_address: 172.37.3.2

networks:
  operations_intranet:
    external: true
  liquibrium_intranet:
    external: true
