[meta]
  dir = "/var/lib/influxdb/meta"

[data]
  dir = "/var/lib/influxdb/data"
  engine = "tsm1"
  wal-dir = "/var/lib/influxdb/wal"
  index-version = "tsi1"   # on-disk index: the in-memory index kept 9 GB of series in RAM (2026-11-09; built with influx_inspect buildtsi)

#[http]
#  auth-enabled = true

[monitor]
  store-enabled = false
