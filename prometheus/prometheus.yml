# my global config
global:
  scrape_interval:     25s # By default, scrape targets every 15 seconds.
  evaluation_interval: 15s # By default, scrape targets every 15 seconds.
  # scrape_timeout is set to the global default (10s).

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
      monitor: 'finsec'

# Load and evaluate rules in this file every 'evaluation_interval' seconds.
rule_files:
  - 'alert.rules'
  # - "first.rules"
  # - "second.rules"

# alert
alerting:
  alertmanagers:
  - scheme: http
    static_configs:
    - targets:
      - "prometheus-alertmanager:9093"

# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'

    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 15s

    static_configs:
    - targets:
      - "localhost:9090"

  - job_name: 'cadvisor'

    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 5s
    honor_timestamps: false   # cAdvisor timestamps of stale cgroups trigger 'too old' warnings

    dns_sd_configs:
    - names:
      - 'tasks.prometheus-cadvisor'
      type: 'A'
      port: 8080

    static_configs:
    - targets: ['prometheus-cadvisor:8080']

  - job_name: 'node-exporter'

    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 5s

    dns_sd_configs:
    - names:
      - 'tasks.prometheus-node-exporter'
      type: 'A'
      port: 9100
    
    static_configs:
    - targets: ['prometheus-node-exporter:9100']

  # perseus NAS (192.168.2.8): node_exporter and process-exporter containers run in its Container Station (/share/Container/monitoring)
  - job_name: 'perseus'
    scrape_interval: 30s
    static_configs:
    - targets: ['192.168.2.8:9100']
      labels: {host: perseus, exporter: node}
    - targets: ['192.168.2.8:9256']
      labels: {host: perseus, exporter: process}

  # router2 (pfSense, CARP backup of router1, 192.168.2.254): the pfSense package node_exporter (System > Package Manager, Services > Prometheus node_exporter,
  # listen on LAN :9100, collectors boottime cpu devstat exec filesystem loadavg meminfo netdev textfile time). SMART, pf, gateways and processes come from
  # scripts/router-metrics.sh as router_*{host="router2"} (docs/monitoring.md).
  - job_name: 'router2'
    scrape_interval: 30s
    static_configs:
    - targets: ['192.168.2.254:9100']
      labels: {host: router2, exporter: node}

  # Ping of router2 every 15 s through the blackbox exporter (module icmp): shows when it is off, which node_exporter alone cannot (alert router2_unreachable).
  - job_name: 'router_icmp'
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
    - targets: ['192.168.2.254']
      labels: {host: router2}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: prometheus-blackbox-exporter:9115

  # Database and Redis exporters (issue #18, docs/monitoring.md): one exporter per kind, the target goes in as a URL parameter.
  # Keep the target lists in sync with PG / MYSQL / REDIS_AUTH in ../exporters-init.sh.
  - job_name: 'redis'
    scrape_interval: 60s
    metrics_path: /scrape
    static_configs:
    - targets:
      - redis://gitlab-redis:6379
      - redis://nextcloud-redis:6379
      - redis://paperless-broker:6379
      - redis://security-dojo-valkey:6379
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        regex: 'redis://([^:]+):.*'
        replacement: '$1'
        target_label: instance
      - target_label: __address__
        replacement: prometheus-redis-exporter:9121

  - job_name: 'postgres'
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /probe
    params:
      auth_module: [exporter]
    static_configs:
    - targets:
      - gitlab-postgresql:5432
      - helpdesk-postgresql:5432
      - mail-roundcube-db:5432
      - mattermost-db:5432
      - openproject-db:5432
      - protonmail-roundcubedb:5432
      - security-dojo-db:5432
      - vaultwarden-db:5432
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.*)'
        replacement: '${1}/postgres'      # the exporter user has no database of its own
        target_label: __param_target
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        replacement: '$1'
        target_label: instance
      - target_label: __address__
        replacement: prometheus-postgres-exporter:9187

  - job_name: 'mysql'
    scrape_interval: 60s
    scrape_timeout: 30s
    metrics_path: /probe
    static_configs:
    - targets:
      - limesurvey-db:3306
      - matomo-db:3306
      - nextcloud-db:3306
      - nextcloud-screeenly-db:3306
      - paperless-db:3306
      - photos-db:4001                     # listens on 4001 (--port=4001)
      - pictures-db:4001                   # listens on 4001 (--port=4001)
      - websites-liquibrium-exchange-db:3306
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        replacement: '$1'
        target_label: instance
      - target_label: __address__
        replacement: prometheus-mysqld-exporter:9104

  - job_name: 'blackbox'
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_2xx]  # Look for a HTTP 200 response.
    static_configs:
